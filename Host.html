<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI LÀ TRIỆU PHÚ</title><script src="https://unpkg.com/mqtt@5.16.0/dist/mqtt.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#173a86,#07142f 65%);color:#fff;font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:24px}.card{background:rgba(0,0,0,.30);border:1px solid rgba(255,255,255,.15);border-radius:22px;padding:28px;box-shadow:0 15px 40px rgba(0,0,0,.28)}h1{font-family:Georgia,serif;text-align:center;color:#ffd33d;font-size:42px;margin:5px 0 8px}.sub{text-align:center;opacity:.82;margin-bottom:22px}.panel{max-width:850px;margin:0 auto}.hidden{display:none!important}.status,.note{text-align:center}.status{font-size:18px;margin:14px 0}.players{margin-top:16px;padding:15px;background:rgba(255,255,255,.08);border-radius:12px}.qr{background:#fff;padding:12px;border-radius:14px;width:max-content;margin:14px auto}.hostLink{word-break:break-all;text-align:center;font-size:14px;opacity:.8}.big{font-size:90px;text-align:center;color:#ffd33d;font-weight:900;margin:22px}.timer{font-size:52px;text-align:center;color:#ffd33d;font-weight:900}.q{font-size:28px;font-weight:800;line-height:1.4;margin:18px 0}.answers{display:grid;gap:12px}.answer{width:100%;padding:15px;border:0;border-radius:12px;background:#173b86;color:#fff;text-align:left;font-size:18px;font-weight:700;cursor:pointer}.answer:disabled{cursor:default}.answer.selected{outline:3px solid #ffd33d;background:#2457b5}.ok{background:#198754!important}.submitbtn,.joinbtn,.controls button{width:100%;padding:15px;border:0;border-radius:12px;font-size:18px;font-weight:800;background:#ffd33d;color:#07142f;cursor:pointer;margin-top:10px}.controls button:disabled,.submitbtn:disabled,.joinbtn:disabled{opacity:.45;cursor:not-allowed}input{width:100%;padding:15px;border:0;border-radius:12px;font-size:18px;margin:8px 0;color:#111}table{width:100%;border-collapse:collapse;margin-top:18px}th,td{padding:11px;border-bottom:1px solid rgba(255,255,255,.15);text-align:center}th{color:#ffd33d}.rank1{font-size:24px;color:#ffd33d}.info{padding:12px;border-radius:10px;background:rgba(255,255,255,.08);margin-top:14px}.conn{text-align:center;font-size:14px;opacity:.8}</style></head><body><div class="wrap"><div class="card"><h1>AI LÀ TRIỆU PHÚ</h1><div class="sub">Màn hình quản trò</div><section id="hostPanel" class="panel"><h2>🎤 QUẢN TRÒ</h2><div id="status" class="status">⏳ Đang kết nối máy chủ trò chơi...</div><div class="info"><div style="text-align:center;font-weight:800">📱 QUÉT QR ĐỂ THAM GIA</div><div id="qr" class="qr"></div><div id="playerLink" class="hostLink"></div><div id="connInfo" class="conn">Đang kết nối...</div></div><div class="players">👥 Người chơi: <b id="count">0</b><div id="names" class="note">Đang chờ người chơi...</div></div><div class="controls"><button id="start" disabled>▶ BẮT ĐẦU</button></div></section><section id="game" class="hidden panel"><div id="timer" class="timer">15</div><div id="qno" class="note"></div><div id="question" class="q"></div><div id="answers" class="answers"></div><div id="reveal" class="status"></div></section><section id="roundResults" class="hidden panel"><h2 style="text-align:center">📊 KẾT QUẢ CÂU VỪA RỒI</h2><div id="roundTitle" class="note"></div><table><thead><tr><th>Hạng</th><th>Tên</th><th>Thời gian</th><th>Điểm câu</th><th>Tổng điểm</th></tr></thead><tbody id="roundBoard"></tbody></table></section><section id="results" class="hidden panel"><h2 style="text-align:center">🏆 TỔNG KẾT BẢNG XẾP HẠNG</h2><table><thead><tr><th>Hạng</th><th>Tên</th><th>Tổng điểm</th></tr></thead><tbody id="board"></tbody></table></section></div></div><script>const QUESTIONS=[["Theo triết học Mác – Lênin, bản chất con người được hiểu là gì?", ["Bản chất sinh học thuần túy", "Bản chất tinh thần bất biến", "Tổng hòa các quan hệ xã hội", "Do số phận quyết định"], 2], ["Quan niệm triết học Mác – Lênin về “Tự do” là gì?", ["Làm bất cứ điều gì mình muốn", "Nhận thức và hành động theo quy luật khách quan", "Không chịu bất kỳ giới hạn nào", "Sống tách khỏi xã hội"], 1], ["Tự do của cá nhân có quan hệ thế nào với xã hội?", ["Hoàn toàn tách biệt", "Chỉ phụ thuộc vào ý muốn cá nhân", "Được thực hiện trong những điều kiện xã hội nhất định", "Không liên quan đến người khác"], 2], ["Mối quan hệ giữa con người và hoàn cảnh xã hội được hiểu thế nào?", ["Con người hoàn toàn bị hoàn cảnh quyết định", "Hoàn cảnh không ảnh hưởng con người", "Con người vừa chịu tác động vừa cải tạo hoàn cảnh", "Con người tồn tại độc lập với xã hội"], 2], ["Nếu không có các quan hệ xã hội, con người sẽ như thế nào?", ["Vẫn phát triển đầy đủ như một con người xã hội", "Không thể phát triển đầy đủ bản chất xã hội", "Trở nên hoàn toàn tự do", "Không chịu ảnh hưởng nào"], 1], ["Câu thành ngữ hoặc tục ngữ nào thể hiện vai trò của hoàn cảnh?", ["Có công mài sắt, có ngày nên kim", "Đi một ngày đàng, học một sàng khôn", "Gần mực thì đen, gần đèn thì sáng", "Uống nước nhớ nguồn"], 2], ["Câu ca dao hoặc tục ngữ nào thể hiện vai trò của con người trong việc tự quyết định?", ["Cha mẹ sinh con, trời sinh tính", "Có chí thì nên", "Đói cho sạch, rách cho thơm", "Ăn quả nhớ kẻ trồng cây"], 1], ["Yếu tố nào giúp con người phát huy tự do một cách hiện thực?", ["Nhận thức và cải tạo hoàn cảnh", "Chỉ dựa vào may mắn", "Tách khỏi xã hội", "Không cần tuân theo quy luật"], 0], ["Chọn câu hoàn chỉnh chứa các từ Hán – Việt phù hợp.", ["Con người là tổng hòa những quan hệ xã hội", "Con người là sản phẩm của xã hội", "Con người là chủ thể của lịch sử", "Cả ba ý trên"], 3], ["Quan niệm cho rằng “số phận đã được định sẵn” trái với quan điểm nào?", ["Con người không thể thay đổi gì", "Con người có khả năng lựa chọn và hành động trong những điều kiện nhất định", "Xã hội không ảnh hưởng cá nhân", "Mọi thứ đều do may rủi"], 1]],QUESTION_MS=15000,REVEAL_MS=2500,PREP_MS=5000,NEXT_DELAY=4000;
const BROKER='wss://broker.emqx.io:8084/mqtt';
const PLAYER_PAGE='https://phannguyenthanhphat46-hash.github.io/ai-la-trieu-phu/index.html';
const ROOM=(crypto.randomUUID?crypto.randomUUID().replaceAll('-',''):Date.now().toString(36)+Math.random().toString(36).slice(2))+Math.random().toString(36).slice(2,12);
const BASE='ai-ltp-2026/'+ROOM,IN=BASE+'/in',OUT=BASE+'/out';
let client=null,players={},roundAnswers={},current=-1,currentStartAt=0,gameStarted=false,gameFinished=false,timer=null,hostConnected=false;
const $=id=>document.getElementById(id);function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function pub(m){if(client&&client.connected)client.publish(OUT,JSON.stringify(m),{qos:1})}function sendTo(to,m){pub({...m,to})}
function safeScores(){const o={};for(const [n,p] of Object.entries(players))o[n]={score:Number(p.score)||0};return o}
function setupQR(){const url=PLAYER_PAGE+'#r='+encodeURIComponent(ROOM);$('playerLink').textContent=url;$('qr').innerHTML='';new QRCode($('qr'),{text:url,width:210,height:210,correctLevel:QRCode.CorrectLevel.M})}
function renderNames(){const list=Object.entries(players).filter(([n,p])=>Date.now()-(p.lastSeen||0)<25000).map(([n])=>n).sort((a,b)=>a.localeCompare(b,'vi'));$('count').textContent=list.length;$('names').textContent=list.length?list.join(' • '):'Đang chờ người chơi...';$('start').disabled=gameStarted||!list.length||!hostConnected}
function showQ(i,st){current=i;currentStartAt=st;$('hostPanel').classList.add('hidden');$('roundResults').classList.add('hidden');$('results').classList.add('hidden');$('game').classList.remove('hidden');$('qno').textContent='Câu '+(i+1)+'/'+QUESTIONS.length;$('question').textContent=QUESTIONS[i][0];$('answers').innerHTML=QUESTIONS[i][1].map((x,j)=>'<button class="answer" disabled>'+String.fromCharCode(65+j)+'. '+esc(x)+'</button>').join('');$('reveal').textContent='';runTimer(st+QUESTION_MS,i)}
function runTimer(deadline,i){clearInterval(timer);const tick=()=>{const left=Math.max(0,deadline-Date.now());$('timer').textContent=Math.ceil(left/1000);if(left<=0){clearInterval(timer);reveal(i)}};timer=setInterval(tick,50);tick()}
function reveal(i){const q=QUESTIONS[i];[...$('answers').children].forEach((b,j)=>{b.disabled=true;if(j===q[2])b.classList.add('ok')});$('reveal').textContent='✅ Đáp án đúng: '+String.fromCharCode(65+q[2]);setTimeout(()=>showRoundResults(i),REVEAL_MS)}
function fmt(ms){return ms==null?'—':(Number(ms)/1000).toFixed(2)+'s'}
function renderRoundBoard(i){const rows=Object.keys(players).filter(n=>Date.now()-(players[n].lastSeen||0)<30000).sort((a,b)=>{const sa=players[a].score||0,sb=players[b].score||0;if(sb!==sa)return sb-sa;return(roundAnswers[a]?.elapsedMs??Infinity)-(roundAnswers[b]?.elapsedMs??Infinity)});$('roundTitle').textContent='Sau câu '+(i+1)+': xếp hạng hiện tại';$('roundBoard').innerHTML=rows.map((n,k)=>{const r=roundAnswers[n];return '<tr><td class="'+(k===0?'rank1':'')+'">'+(k+1)+'</td><td>'+esc(n)+'</td><td>'+fmt(r?.elapsedMs)+'</td><td>'+(r?.points||0)+'</td><td>'+(players[n].score||0)+'</td></tr>'}).join('')||'<tr><td colspan="5">Chưa có dữ liệu</td></tr>'}
function showRoundResults(i){$('game').classList.add('hidden');$('roundResults').classList.remove('hidden');renderRoundBoard(i);pub({type:'ROUND_RESULTS',i,answers:roundAnswers,scores:safeScores(),to:'ALL'});setTimeout(()=>{if(i+1<QUESTIONS.length){const st=Date.now()+500;currentStartAt=st;pub({type:'Q',i:i+1,startAt:st,to:'ALL'});showQ(i+1,st)}else{gameStarted=false;gameFinished=true;$('roundResults').classList.add('hidden');$('results').classList.remove('hidden');renderBoard();pub({type:'RESULTS',scores:safeScores(),to:'ALL'})}},NEXT_DELAY)}
function renderBoard(){$('board').innerHTML=Object.keys(players).sort((a,b)=>(players[b].score||0)-(players[a].score||0)).map((n,i)=>'<tr><td class="'+(i===0?'rank1':'')+'">'+(i+1)+'</td><td>'+esc(n)+'</td><td>'+(players[n].score||0)+'</td></tr>').join('')||'<tr><td colspan="3">Chưa có dữ liệu</td></tr>'}
function uniqueName(raw){const base=String(raw||'Người chơi').trim().slice(0,30)||'Người chơi';if(!players[base]||Date.now()-(players[base].lastSeen||0)>25000)return base;let n=2;while(players[base+' ('+n+')']&&Date.now()-(players[base+' ('+n+')'].lastSeen||0)<25000)n++;return base+' ('+n+')'}
function onInput(m){let p,name;if(!m||!m.type)return;if(m.type==='JOIN'){if(gameStarted||gameFinished){sendTo(m.pid,{type:'WELCOME',name:m.name,gameStarted,gameFinished,current,currentStartAt,scores:safeScores(),hostNow:Date.now()});return}name=uniqueName(m.name);players[name]={score:0,lastSeen:Date.now(),pid:m.pid};sendTo(m.pid,{type:'WELCOME',name,gameStarted:false,gameFinished:false,current:-1,scores:safeScores(),hostNow:Date.now()});renderNames();return}if(m.type==='PING'){for(const [n,x] of Object.entries(players))if(x.pid===m.pid)x.lastSeen=Date.now();renderNames();return}if(m.type==='ANSWER'){p=Object.values(players).find(x=>x.pid===m.pid);name=Object.keys(players).find(n=>players[n]===p);if(!p||!name||Number(m.question)!==current||roundAnswers[name])return;const elapsed=Math.max(0,Math.min(QUESTION_MS,Number(m.elapsedMs)||0)),correct=Number(m.answer)===QUESTIONS[current][2],points=correct?Math.max(100,2000-Math.min(1900,Math.round(elapsed/10))):0;roundAnswers[name]={elapsedMs:elapsed,points,correct};p.score+=points}}
function connect(){const cid='ailtp_host_'+Math.random().toString(36).slice(2,12);client=mqtt.connect(BROKER,{clientId:cid,clean:true,reconnectPeriod:1000,connectTimeout:8000,keepalive:30});client.on('connect',()=>{hostConnected=true;$('status').textContent='🟢 Quản trò đã sẵn sàng — QR đang hoạt động';$('connInfo').textContent='🟢 Máy chủ trò chơi đã kết nối';client.subscribe(IN,{qos:1},()=>renderNames())});client.on('reconnect',()=>{hostConnected=false;$('status').textContent='🟠 Đang tự kết nối lại máy chủ trò chơi...';renderNames()});client.on('offline',()=>{hostConnected=false;$('status').textContent='🟠 Mất kết nối máy chủ — đang tự kết nối lại...';renderNames()});client.on('error',()=>{hostConnected=false;$('status').textContent='❌ Không kết nối được máy chủ trò chơi. Đang thử lại...';renderNames()});client.on('message',(t,p)=>{try{onInput(JSON.parse(p.toString()))}catch(e){}})}
$('start').onclick=()=>{const active=Object.entries(players).filter(([n,p])=>Date.now()-(p.lastSeen||0)<25000);if(!hostConnected||!active.length)return;gameStarted=true;gameFinished=false;roundAnswers={};Object.values(players).forEach(p=>p.score=0);const st=Date.now()+PREP_MS;currentStartAt=st;pub({type:'START',startAt:st,to:'ALL'});$('hostPanel').classList.add('hidden');$('game').classList.remove('hidden');let t=setInterval(()=>{const l=Math.max(0,st-Date.now());$('timer').textContent=Math.ceil(l/1000);if(l<=0){clearInterval(t);const qst=Date.now()+300;currentStartAt=qst;pub({type:'Q',i:0,startAt:qst,to:'ALL'});showQ(0,qst)}},50)};
setInterval(()=>{for(const n of Object.keys(players))if(Date.now()-(players[n].lastSeen||0)>30000)delete players[n];renderNames()},5000);setupQR();connect();</script></body></html>
