<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI LÀ TRIỆU PHÚ</title><script src="https://unpkg.com/mqtt@5.16.0/dist/mqtt.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#173a86,#07142f 65%);color:#fff;font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:24px}.card{background:rgba(0,0,0,.30);border:1px solid rgba(255,255,255,.15);border-radius:22px;padding:28px;box-shadow:0 15px 40px rgba(0,0,0,.28)}h1{font-family:Georgia,serif;text-align:center;color:#ffd33d;font-size:42px;margin:5px 0 8px}.sub{text-align:center;opacity:.82;margin-bottom:22px}.panel{max-width:850px;margin:0 auto}.hidden{display:none!important}.status,.note{text-align:center}.status{font-size:18px;margin:14px 0}.players{margin-top:16px;padding:15px;background:rgba(255,255,255,.08);border-radius:12px}.qr{background:#fff;padding:12px;border-radius:14px;width:max-content;margin:14px auto}.hostLink{word-break:break-all;text-align:center;font-size:14px;opacity:.8}.big{font-size:90px;text-align:center;color:#ffd33d;font-weight:900;margin:22px}.timer{font-size:52px;text-align:center;color:#ffd33d;font-weight:900}.q{font-size:28px;font-weight:800;line-height:1.4;margin:18px 0}.answers{display:grid;gap:12px}.answer{width:100%;padding:15px;border:0;border-radius:12px;background:#173b86;color:#fff;text-align:left;font-size:18px;font-weight:700;cursor:pointer}.answer:disabled{cursor:default}.answer.selected{outline:3px solid #ffd33d;background:#2457b5}.ok{background:#198754!important}.submitbtn,.joinbtn,.controls button{width:100%;padding:15px;border:0;border-radius:12px;font-size:18px;font-weight:800;background:#ffd33d;color:#07142f;cursor:pointer;margin-top:10px}.controls button:disabled,.submitbtn:disabled,.joinbtn:disabled{opacity:.45;cursor:not-allowed}input{width:100%;padding:15px;border:0;border-radius:12px;font-size:18px;margin:8px 0;color:#111}table{width:100%;border-collapse:collapse;margin-top:18px}th,td{padding:11px;border-bottom:1px solid rgba(255,255,255,.15);text-align:center}th{color:#ffd33d}.rank1{font-size:24px;color:#ffd33d}.info{padding:12px;border-radius:10px;background:rgba(255,255,255,.08);margin-top:14px}.conn{text-align:center;font-size:14px;opacity:.8}</style></head><body><div class="wrap"><div class="card"><h1>AI LÀ TRIỆU PHÚ</h1><div class="sub">Trò chơi tương tác cùng cả lớp</div><section id="join" class="panel"><h2>👤 THAM GIA</h2><input id="name" maxlength="30" placeholder="Nhập tên của bạn"><button id="joinBtn" class="joinbtn">VÀO TRÒ CHƠI</button><div id="status" class="status"></div></section><section id="count" class="hidden panel"><div id="countNum" class="big">5</div><div class="note">Chuẩn bị...</div></section><section id="game" class="hidden panel"><div id="timer" class="timer">15</div><div id="qno" class="note"></div><div id="question" class="q"></div><div id="answers" class="answers"></div><button id="submitBtn" class="submitbtn" disabled>XÁC NHẬN NỘP</button><div id="reveal" class="status"></div></section><section id="roundResults" class="hidden panel"><h2 style="text-align:center">📊 KẾT QUẢ CÂU VỪA RỒI</h2><div id="roundTitle" class="note"></div><table><thead><tr><th>Hạng</th><th>Tên</th><th>Thời gian</th><th>Điểm câu</th><th>Tổng điểm</th></tr></thead><tbody id="roundBoard"></tbody></table></section><section id="results" class="hidden panel"><h2 style="text-align:center">🏆 TỔNG KẾT BẢNG XẾP HẠNG</h2><table><thead><tr><th>Hạng</th><th>Tên</th><th>Tổng điểm</th></tr></thead><tbody id="board"></tbody></table></section></div></div><script>const QUESTIONS=[["Theo triết học Mác – Lênin, bản chất con người được hiểu là gì?", ["Bản chất sinh học thuần túy", "Bản chất tinh thần bất biến", "Tổng hòa các quan hệ xã hội", "Do số phận quyết định"], 2], ["Quan niệm triết học Mác – Lênin về “Tự do” là gì?", ["Làm bất cứ điều gì mình muốn", "Nhận thức và hành động theo quy luật khách quan", "Không chịu bất kỳ giới hạn nào", "Sống tách khỏi xã hội"], 1], ["Tự do của cá nhân có quan hệ thế nào với xã hội?", ["Hoàn toàn tách biệt", "Chỉ phụ thuộc vào ý muốn cá nhân", "Được thực hiện trong những điều kiện xã hội nhất định", "Không liên quan đến người khác"], 2], ["Mối quan hệ giữa con người và hoàn cảnh xã hội được hiểu thế nào?", ["Con người hoàn toàn bị hoàn cảnh quyết định", "Hoàn cảnh không ảnh hưởng con người", "Con người vừa chịu tác động vừa cải tạo hoàn cảnh", "Con người tồn tại độc lập với xã hội"], 2], ["Nếu không có các quan hệ xã hội, con người sẽ như thế nào?", ["Vẫn phát triển đầy đủ như một con người xã hội", "Không thể phát triển đầy đủ bản chất xã hội", "Trở nên hoàn toàn tự do", "Không chịu ảnh hưởng nào"], 1], ["Câu thành ngữ hoặc tục ngữ nào thể hiện vai trò của hoàn cảnh?", ["Có công mài sắt, có ngày nên kim", "Đi một ngày đàng, học một sàng khôn", "Gần mực thì đen, gần đèn thì sáng", "Uống nước nhớ nguồn"], 2], ["Câu ca dao hoặc tục ngữ nào thể hiện vai trò của con người trong việc tự quyết định?", ["Cha mẹ sinh con, trời sinh tính", "Có chí thì nên", "Đói cho sạch, rách cho thơm", "Ăn quả nhớ kẻ trồng cây"], 1], ["Yếu tố nào giúp con người phát huy tự do một cách hiện thực?", ["Nhận thức và cải tạo hoàn cảnh", "Chỉ dựa vào may mắn", "Tách khỏi xã hội", "Không cần tuân theo quy luật"], 0], ["Chọn câu hoàn chỉnh chứa các từ Hán – Việt phù hợp.", ["Con người là tổng hòa những quan hệ xã hội", "Con người là sản phẩm của xã hội", "Con người là chủ thể của lịch sử", "Cả ba ý trên"], 3], ["Quan niệm cho rằng “số phận đã được định sẵn” trái với quan điểm nào?", ["Con người không thể thay đổi gì", "Con người có khả năng lựa chọn và hành động trong những điều kiện nhất định", "Xã hội không ảnh hưởng cá nhân", "Mọi thứ đều do may rủi"], 1]],QUESTION_MS=15000;const BROKER='wss://broker.emqx.io:8084/mqtt';
const u=new URL(location.href);let ROOM='';try{ROOM=new URLSearchParams(location.hash.replace(/^#/,'')).get('r')||''}catch(e){}if(!ROOM)ROOM=u.searchParams.get('r')||'';try{ROOM=decodeURIComponent(ROOM)}catch(e){}
const BASE=ROOM?'ai-ltp-2026/'+ROOM:'',IN=BASE+'/in',OUT=BASE+'/out';const $=id=>document.getElementById(id);const join=$('join'),statusEl=$('status'),count=$('count'),game=$('game'),results=$('results'),roundResults=$('roundResults'),timerEl=$('timer'),qno=$('qno'),questionEl=$('question'),answersEl=$('answers'),revealEl=$('reveal'),submitBtn=$('submitBtn'),joinBtn=$('joinBtn');
let client=null,myName='',pid=(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2)),timer=null,currentI=-1,currentDeadline=0,selected=-1,answered=false,offset=0,joined=false,joinTimeout=null,pingTimer=null,manual=false;
function now(){return Date.now()+offset}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function setStatus(s){statusEl.textContent=s}function pub(m){if(client&&client.connected)client.publish(IN,JSON.stringify(m),{qos:1})}
function showCountdown(at){join.classList.add('hidden');count.classList.remove('hidden');game.classList.add('hidden');roundResults.classList.add('hidden');results.classList.add('hidden');clearInterval(timer);const tick=()=>{const l=Math.max(0,Number(at)-now());$('countNum').textContent=Math.max(1,Math.ceil(l/1000));if(l<=0)clearInterval(timer)};timer=setInterval(tick,50);tick()}
function showQ(i,st){if(!QUESTIONS[i])return;currentI=Number(i);currentDeadline=Number(st)+QUESTION_MS;count.classList.add('hidden');game.classList.remove('hidden');roundResults.classList.add('hidden');results.classList.add('hidden');answered=false;selected=-1;submitBtn.disabled=true;revealEl.textContent='';qno.textContent='Câu '+(i+1)+'/'+QUESTIONS.length;questionEl.textContent=QUESTIONS[i][0];answersEl.innerHTML='';QUESTIONS[i][1].forEach((x,j)=>{const b=document.createElement('button');b.className='answer';b.textContent=String.fromCharCode(65+j)+'. '+x;b.onclick=()=>{if(answered)return;selected=j;[...answersEl.children].forEach(x=>x.classList.remove('selected'));b.classList.add('selected');submitBtn.disabled=false};answersEl.appendChild(b)});runTimer(currentDeadline,i)}
function runTimer(deadline,i){clearInterval(timer);const tick=()=>{const l=Math.max(0,deadline-now());timerEl.textContent=Math.ceil(l/1000);if(l<=0){clearInterval(timer);sendAnswer(i,-1);reveal(i)}};timer=setInterval(tick,50);tick()}
function sendAnswer(i,j){if(answered||i!==currentI)return;answered=true;submitBtn.disabled=true;[...answersEl.children].forEach(x=>x.disabled=true);const elapsedMs=Math.max(0,Math.min(QUESTION_MS,now()-(currentDeadline-QUESTION_MS)));pub({type:'ANSWER',pid,question:i,answer:j,elapsedMs})}
function reveal(i){const q=QUESTIONS[i];[...answersEl.children].forEach((b,j)=>{b.disabled=true;if(j===q[2])b.classList.add('ok')});revealEl.textContent='✅ Đáp án đúng: '+String.fromCharCode(65+q[2])}
function renderRoundBoard(scores,answers,i){const names=Object.keys(scores||{}).sort((a,b)=>{const sa=scores[a]?.score||0,sb=scores[b]?.score||0;if(sb!==sa)return sb-sa;return(answers?.[a]?.elapsedMs??Infinity)-(answers?.[b]?.elapsedMs??Infinity)});$('roundTitle').textContent='Sau câu '+(i+1)+': xếp hạng hiện tại';$('roundBoard').innerHTML=names.map((n,k)=>{const r=answers?.[n],ms=r?.elapsedMs==null?'—':(Number(r.elapsedMs)/1000).toFixed(2)+'s';return '<tr><td class="'+(k===0?'rank1':'')+'">'+(k+1)+'</td><td>'+esc(n)+'</td><td>'+ms+'</td><td>'+(r?.points||0)+'</td><td>'+(scores[n]?.score||0)+'</td></tr>'}).join('')||'<tr><td colspan="5">Chưa có dữ liệu</td></tr>';roundResults.classList.remove('hidden');game.classList.add('hidden');count.classList.add('hidden')}
function renderBoard(scores){$('board').innerHTML=Object.keys(scores||{}).sort((a,b)=>(scores[b]?.score||0)-(scores[a]?.score||0)).map((n,i)=>'<tr><td class="'+(i===0?'rank1':'')+'">'+(i+1)+'</td><td>'+esc(n)+'</td><td>'+(scores[n]?.score||0)+'</td></tr>').join('')||'<tr><td colspan="3">Chưa có dữ liệu</td></tr>';results.classList.remove('hidden');game.classList.add('hidden');count.classList.add('hidden');roundResults.classList.add('hidden')}
function handle(m){if(!m||!m.type)return;if(m.to&&m.to!=='ALL'&&m.to!==pid)return;if(m.type==='WELCOME'){clearTimeout(joinTimeout);joined=true;if(m.name)myName=m.name;if(Number.isFinite(Number(m.hostNow)))offset=Number(m.hostNow)-Date.now();setStatus('🟢 Đã tham gia! Chờ quản trò bấm BẮT ĐẦU.');if(m.gameFinished)renderBoard(m.scores||{});else if(m.gameStarted&&m.current>=0)showQ(m.current,m.currentStartAt);else if(m.gameStarted)showCountdown(m.currentStartAt);return}if(m.type==='START')showCountdown(m.startAt);if(m.type==='Q')showQ(m.i,m.startAt);if(m.type==='ROUND_RESULTS'){clearInterval(timer);reveal(m.i);renderRoundBoard(m.scores,m.answers,m.i)}if(m.type==='RESULTS'){clearInterval(timer);renderBoard(m.scores||{})}}
function connect(){const cid='ailtp_player_'+pid.replace(/-/g,'').slice(0,20);client=mqtt.connect(BROKER,{clientId:cid,clean:true,reconnectPeriod:1000,connectTimeout:8000,keepalive:30});client.on('connect',()=>{setStatus('🟡 Đã kết nối máy chủ — đang vào trò chơi...');client.subscribe(OUT,{qos:1},()=>{pub({type:'JOIN',pid,name:myName});clearTimeout(joinTimeout);joinTimeout=setTimeout(()=>{if(!joined)setStatus('🟠 Quản trò chưa phản hồi. Hãy quét lại QR mới nhất.')},8000);clearInterval(pingTimer);pingTimer=setInterval(()=>pub({type:'PING',pid}),5000)})});client.on('reconnect',()=>setStatus('🟠 Đang tự kết nối lại máy chủ trò chơi...'));client.on('offline',()=>{if(manual)setStatus('🟠 Mất kết nối máy chủ — đang tự kết nối lại...')});client.on('error',()=>{if(manual)setStatus('❌ Không kết nối được máy chủ trò chơi. Đang thử lại...')});client.on('message',(t,p)=>{try{handle(JSON.parse(p.toString()))}catch(e){}})}
if(!ROOM){setStatus('⚠️ Hãy quét QR của quản trò để tham gia.');joinBtn.disabled=true}else setStatus('📱 QR hợp lệ — nhập tên rồi bấm VÀO TRÒ CHƠI.');joinBtn.onclick=()=>{const n=$('name').value.trim();if(!n)return setStatus('⚠️ Hãy nhập tên trước.');if(!ROOM)return setStatus('⚠️ QR không chứa mã quản trò.');myName=n.slice(0,30);manual=true;joinBtn.disabled=true;setStatus('⏳ Đang kết nối máy chủ trò chơi...');connect()};submitBtn.onclick=()=>{if(selected>=0)sendAnswer(currentI,selected)};</script></body></html>
