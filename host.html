<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI LÀ TRIỆU PHÚ — Quản trò</title><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#173a86,#07142f 65%);color:#fff;font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:24px}.card{background:rgba(0,0,0,.30);border:1px solid rgba(255,255,255,.15);border-radius:22px;padding:28px;box-shadow:0 15px 40px rgba(0,0,0,.28)}h1{font-family:Georgia,serif;text-align:center;color:#ffd33d;font-size:42px;margin:5px 0 8px}.sub{text-align:center;opacity:.82;margin-bottom:22px}.panel{max-width:780px;margin:0 auto}.hidden{display:none!important}.status,.note{text-align:center}.status{font-size:18px;margin:14px 0}.players{margin-top:16px;padding:15px;background:rgba(255,255,255,.08);border-radius:12px}.qr{background:#fff;padding:12px;border-radius:14px;width:max-content;margin:14px auto}.hostLink{display:none}.big{font-size:90px;text-align:center;color:#ffd33d;font-weight:900;margin:22px}.timer{font-size:52px;text-align:center;color:#ffd33d;font-weight:900}.q{font-size:28px;font-weight:800;line-height:1.4;margin:18px 0}.answers{display:grid;gap:12px}.answer{width:100%;padding:15px;border:0;border-radius:12px;background:#173b86;color:#fff;text-align:left;font-size:18px;font-weight:700;cursor:pointer}.answer:disabled{cursor:default}.controls button,.joinbtn{width:100%;padding:15px;border:0;border-radius:12px;font-size:18px;font-weight:800;background:#ffd33d;color:#07142f;cursor:pointer;margin-top:10px}.controls button:disabled{opacity:.45;cursor:not-allowed}input{width:100%;padding:15px;border:0;border-radius:12px;font-size:18px;margin:8px 0;color:#111}table{width:100%;border-collapse:collapse;margin-top:18px}th,td{padding:11px;border-bottom:1px solid rgba(255,255,255,.15);text-align:center}th{color:#ffd33d}.rank1{font-size:24px;color:#ffd33d}.ok{background:#198754!important}.bad{background:#b02a37!important}.info{padding:12px;border-radius:10px;background:rgba(255,255,255,.08);margin-top:14px}
</style></head>
<body><div class="wrap"><div class="card"><h1>AI LÀ TRIỆU PHÚ</h1><div class="sub">Màn hình quản trò</div>
<section id="hostPanel" class="panel">
<h2>🎤 QUẢN TRÒ</h2><div id="status" class="status">Đang kết nối...</div>
<div class="info"><div style="text-align:center">📱 QUÉT QR ĐỂ THAM GIA</div><div id="qr" class="qr"></div><div id="playerLink" class="hostLink"></div></div>
<div class="players">👥 Người chơi: <b id="count">0</b><div id="names" class="note">Đang chờ người chơi...</div></div>
<div class="controls"><button id="start" disabled>▶ BẮT ĐẦU</button></div>
</section>
<section id="game" class="hidden panel"><div id="timer" class="timer">15</div><div id="qno" class="note"></div><div id="question" class="q"></div><div id="answers" class="answers"></div><div id="reveal" class="status"></div></section>
<section id="roundResults" class="hidden panel"><h2 style="text-align:center">📊 KẾT QUẢ CÂU VỪA RỒI</h2><div id="roundTitle" class="note"></div><table><thead><tr><th>Hạng</th><th>Tên</th><th>Thời gian</th><th>Điểm câu</th><th>Tổng điểm</th></tr></thead><tbody id="roundBoard"></tbody></table></section>
<section id="results" class="hidden panel"><h2 style="text-align:center">🏆 TỔNG KẾT BẢNG XẾP HẠNG</h2><table><thead><tr><th>Hạng</th><th>Tên</th><th>Tổng điểm</th></tr></thead><tbody id="board"></tbody></table></section>
</div></div>
<script>
const QUESTIONS=[["Theo triết học Mác – Lênin, bản chất con người được hiểu là gì?", ["Bản chất sinh học thuần túy", "Bản chất tinh thần bất biến", "Tổng hòa các quan hệ xã hội", "Do số phận quyết định"], 2], ["Quan niệm triết học Mác – Lênin về “Tự do” là gì?", ["Làm bất cứ điều gì mình muốn", "Nhận thức và hành động theo quy luật khách quan", "Không chịu bất kỳ giới hạn nào", "Sống tách khỏi xã hội"], 1], ["Tự do của cá nhân có quan hệ thế nào với xã hội?", ["Hoàn toàn tách biệt", "Chỉ phụ thuộc vào ý muốn cá nhân", "Được thực hiện trong những điều kiện xã hội nhất định", "Không liên quan đến người khác"], 2], ["Mối quan hệ giữa con người và hoàn cảnh xã hội được hiểu thế nào?", ["Con người hoàn toàn bị hoàn cảnh quyết định", "Hoàn cảnh không ảnh hưởng con người", "Con người vừa chịu tác động vừa cải tạo hoàn cảnh", "Con người tồn tại độc lập với xã hội"], 2], ["Nếu không có các quan hệ xã hội, con người sẽ như thế nào?", ["Vẫn phát triển đầy đủ như một con người xã hội", "Không thể phát triển đầy đủ bản chất xã hội", "Trở nên hoàn toàn tự do", "Không chịu ảnh hưởng nào"], 1], ["Câu thành ngữ hoặc tục ngữ nào thể hiện vai trò của hoàn cảnh?", ["Có công mài sắt, có ngày nên kim", "Đi một ngày đàng, học một sàng khôn", "Gần mực thì đen, gần đèn thì sáng", "Uống nước nhớ nguồn"], 2], ["Câu ca dao hoặc tục ngữ nào thể hiện vai trò của con người trong việc tự quyết định?", ["Cha mẹ sinh con, trời sinh tính", "Có chí thì nên", "Đói cho sạch, rách cho thơm", "Ăn quả nhớ kẻ trồng cây"], 1], ["Yếu tố nào giúp con người phát huy tự do một cách hiện thực?", ["Nhận thức và cải tạo hoàn cảnh", "Chỉ dựa vào may mắn", "Tách khỏi xã hội", "Không cần tuân theo quy luật"], 0], ["Chọn câu hoàn chỉnh chứa các từ Hán – Việt phù hợp.", ["Con người là tổng hòa những quan hệ xã hội", "Con người là sản phẩm của xã hội", "Con người là chủ thể của lịch sử", "Cả ba ý trên"], 3], ["Quan niệm cho rằng “số phận đã được định sẵn” trái với quan điểm nào?", ["Con người không thể thay đổi gì", "Con người có khả năng lựa chọn và hành động trong những điều kiện nhất định", "Xã hội không ảnh hưởng cá nhân", "Mọi thứ đều do may rủi"], 1]]; const QUESTION_MS=15000,REVEAL_MS=2000,PREP_MS=5000; const PLAYER_PAGE=location.origin+location.pathname.replace(/host\.html$/,'index.html');
const statusEl=document.getElementById('status'),startBtn=document.getElementById('start'),game=document.getElementById('game'),hostPanel=document.getElementById('hostPanel'),results=document.getElementById('results');
const timerEl=document.getElementById('timer'),qno=document.getElementById('qno'),questionEl=document.getElementById('question'),answersEl=document.getElementById('answers'),revealEl=document.getElementById('reveal');
let peer=null, conns=new Set(), players={}, gameStarted=false, gameStartAt=0, timer=null, current=-1;
let roundAnswers={}, roundDeadline=0, roundResultTimer=null;
function setStatus(t){statusEl.textContent=t;}
function renderNames(){const list=[...conns].filter(c=>c.open).map(c=>c.playerName).filter(Boolean);document.getElementById('count').textContent=list.length;document.getElementById('names').textContent=list.length?list.join(' • '):'Đang chờ người chơi...';}
function setupQR(id){document.getElementById('qr').innerHTML='';const url=PLAYER_PAGE+'#h='+encodeURIComponent(id);new QRCode(document.getElementById('qr'),{text:url,width:210,height:210});document.getElementById('playerLink').textContent=url;}
function showQ(i,startAt){current=i;game.classList.remove('hidden');hostPanel.classList.add('hidden');results.classList.add('hidden');document.getElementById('roundResults').classList.add('hidden');revealEl.textContent='';const q=QUESTIONS[i];qno.textContent=`Câu ${i+1}/${QUESTIONS.length}`;questionEl.textContent=q[0];answersEl.innerHTML='';q[1].forEach((x,j)=>{const b=document.createElement('button');b.className='answer';b.textContent=String.fromCharCode(65+j)+'. '+x;b.disabled=true;answersEl.appendChild(b);});roundAnswers={};roundDeadline=startAt+QUESTION_MS;runTimer(roundDeadline,i);}
function runTimer(deadline,i){clearInterval(timer);const tick=()=>{const left=Math.max(0,deadline-Date.now());timerEl.textContent=Math.ceil(left/1000);if(left<=0){clearInterval(timer);showReveal(i);}};timer=setInterval(tick,50);tick();}
function showReveal(i){const q=QUESTIONS[i];[...answersEl.children].forEach((b,j)=>{b.disabled=true;if(j===q[2])b.classList.add('ok');});revealEl.textContent='✅ Đáp án đúng: '+String.fromCharCode(65+q[2]);setTimeout(()=>showRoundResults(i),REVEAL_MS);}
function formatMs(ms){return ms===null||ms===undefined?'—':(Number(ms)/1000).toFixed(2)+'s';}
function roundOrder(){return Object.keys(players).sort((a,b)=>{const sa=players[a]?.score||0,sb=players[b]?.score||0;if(sb!==sa)return sb-sa;const ta=roundAnswers[a]?.elapsedMs??Infinity,tb=roundAnswers[b]?.elapsedMs??Infinity;return ta-tb;});}
function renderRoundBoard(i){const rows=roundOrder();document.getElementById('roundTitle').textContent=`Sau câu ${i+1}: xếp hạng hiện tại`;document.getElementById('roundBoard').innerHTML=rows.map((name,i)=>{const r=roundAnswers[name];return `<tr><td class="${i===0?'rank1':''}">${i+1}</td><td>${escapeHtml(name)}</td><td>${formatMs(r?.elapsedMs)}</td><td>${r?.points||0}</td><td>${players[name]?.score||0}</td></tr>`;}).join('')||'<tr><td colspan="5">Chưa có dữ liệu</td></tr>';}
function showRoundResults(i){game.classList.add('hidden');hostPanel.classList.add('hidden');results.classList.add('hidden');document.getElementById('roundResults').classList.remove('hidden');renderRoundBoard(i);broadcast({type:'ROUND_RESULTS',i,answers:roundAnswers,scores:players});clearTimeout(roundResultTimer);roundResultTimer=setTimeout(()=>{if(i+1<QUESTIONS.length){const nextStart=Date.now()+500;broadcast({type:'Q',i:i+1,startAt:nextStart});showQ(i+1,nextStart);}else{document.getElementById('roundResults').classList.add('hidden');results.classList.remove('hidden');renderBoard();broadcast({type:'RESULTS',scores:players});}},4000);}
function broadcast(msg){for(const c of conns){if(c.open){try{c.send(msg);}catch{}}}}
function renderBoard(){const rows=Object.keys(players).sort((a,b)=>(players[b]?.score||0)-(players[a]?.score||0));document.getElementById('board').innerHTML=rows.map((name,i)=>`<tr><td class="${i===0?'rank1':''}">${i+1}</td><td>${escapeHtml(name)}</td><td>${players[name]?.score||0}</td></tr>`).join('')||'<tr><td colspan="3">Chưa có dữ liệu</td></tr>';}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function beginGame(){gameStarted=true;gameStartAt=Date.now()+PREP_MS;players={};for(const c of conns){if(c.open&&c.playerName)players[c.playerName]={score:0};}broadcast({type:'START',startAt:gameStartAt});hostPanel.classList.add('hidden');results.classList.add('hidden');document.getElementById('roundResults').classList.add('hidden');game.classList.remove('hidden');timerEl.textContent='5';qno.textContent='';questionEl.textContent='Chuẩn bị...';answersEl.innerHTML='';revealEl.textContent='';clearInterval(timer);let t=setInterval(()=>{const left=Math.max(0,gameStartAt-Date.now());timerEl.textContent=Math.ceil(left/1000);if(left<=0){clearInterval(t);const firstStart=Date.now()+300;broadcast({type:'Q',i:0,startAt:firstStart});showQ(0,firstStart);}},50);}
function initPeer(){
 try{peer=new Peer(undefined,{debug:2});}catch(e){setStatus('❌ Không tạo được kết nối PeerJS');return;}
 peer.on('open',id=>{setStatus('🟢 Quản trò đã sẵn sàng');startBtn.disabled=false;setupQR(id);});
 peer.on('disconnected',()=>{setStatus('🟠 Mất kết nối PeerJS — đang tự kết nối lại...');startBtn.disabled=true;setTimeout(()=>{if(peer&&!peer.destroyed&&peer.disconnected)peer.reconnect();},1000);});
 peer.on('error',e=>{console.error('PeerJS',e);const type=e&&e.type?e.type:'unknown';setStatus('❌ PeerJS lỗi: '+type);if(type==='unavailable-id'){}else if(type==='network'||type==='server-error'||type==='socket-error'||type==='socket-closed'){setTimeout(()=>{try{if(peer&&!peer.destroyed){peer.destroy();}}catch{}initPeer();},1500);}});
 peer.on('close',()=>{setStatus('❌ Kết nối quản trò đã đóng.');startBtn.disabled=true;});
 peer.on('connection',c=>{conns.add(c);c.on('open',()=>{c.send({type:'HELLO',hostNow:Date.now()});renderNames();});c.on('data',d=>{if(d.type==='JOIN'){c.playerName=String(d.name||'Người chơi');if(!players[c.playerName])players[c.playerName]={score:0};renderNames();}if(d.type==='SYNC')c.send({type:'PONG',clientSent:d.clientSent,hostNow:Date.now()});if(d.type==='ANSWER'&&c.playerName&&current>=0&&!roundAnswers[c.playerName]){const points=Math.max(0,Number(d.points)||0);const elapsedMs=Math.max(0,Math.min(QUESTION_MS,Number(d.elapsedMs)||0));roundAnswers[c.playerName]={elapsedMs,points,correct:!!d.correct};if(!players[c.playerName])players[c.playerName]={score:0};players[c.playerName].score+=points;}});c.on('close',()=>{conns.delete(c);renderNames();});c.on('error',()=>{conns.delete(c);renderNames();});});
startBtn.onclick=()=>{if(![...conns].some(c=>c.open)){alert('Chưa có người chơi nào tham gia.');return;}startBtn.disabled=true;beginGame();};
}
initPeer();
</script></body></html>
